<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>開車大字訊息</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #000;
      color: #fff;
    }

    /* ========== 選擇角色畫面 ========== */
    #role-select {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      gap: 28px;
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a2e 100%);
    }

    #role-select h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #role-select p {
      color: #aaa;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 320px;
    }

    .role-btn {
      width: 100%;
      max-width: 300px;
      padding: 22px 20px;
      font-size: 1.35rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .role-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .role-btn.driver {
      background: #00c853;
      color: #000;
    }

    .role-btn.passenger {
      background: #2979ff;
      color: #fff;
    }

    .role-btn small {
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0.85;
    }

    /* ========== 駕駛端（接收 + 可回覆） ========== */
    #driver-view {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #000;
    }

    #driver-header {
      padding: 10px 14px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    #driver-status {
      color: #888;
    }

    #driver-status.connected {
      color: #00e676;
    }

    #peer-id-display {
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 1px;
      color: #fff;
      background: #222;
      padding: 3px 8px;
      border-radius: 6px;
      user-select: all;
    }

    #copy-id-btn, #fullscreen-btn, #font-minus-btn, #font-plus-btn, #clear-text-btn, #share-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #clear-text-btn {
      background: #442222;
      color: #ffaaaa;
    }

    #share-btn {
      background: #06c755;
      color: #fff;
      font-weight: 600;
    }

    #font-minus-btn, #font-plus-btn {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 5px 12px;
      min-width: 36px;
    }

    #message-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    #big-text {
      font-size: var(--big-font-size, 3.5rem);
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 100%;
      overflow-y: auto;
      padding: 8px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.15);
      transition: font-size 0.15s ease;
    }

    #big-text.empty {
      color: #444;
      font-size: 1.3rem;
      font-weight: 400;
    }

    /* 駕駛端回覆輸入列（精簡，不佔太多空間） */
    #driver-reply-bar {
      display: none; /* 連線後才顯示 */
      padding: 10px 12px;
      background: #111;
      border-top: 1px solid #222;
      flex-shrink: 0;
      gap: 8px;
      align-items: center;
    }

    #driver-reply-bar.show {
      display: flex;
    }

    #driver-reply-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 1.05rem;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
    }

    #driver-reply-input:focus {
      border-color: #00c853;
    }

    #driver-send-btn {
      padding: 12px 18px;
      background: #00c853;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #driver-footer {
      padding: 6px 12px;
      background: #0a0a0a;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }

    /* ========== 乘客端（發送 + 接收駕駛回覆） ========== */
    #passenger-view {
      display: none;
      flex-direction: column;
      height: 100%;
      background: #0d1117;
    }

    #passenger-header {
      padding: 12px 14px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }

    #passenger-header h2 {
      font-size: 1.05rem;
      margin-bottom: 8px;
    }

    .connect-row {
      display: flex;
      gap: 8px;
    }

    #peer-id-input {
      flex: 1;
      padding: 11px 12px;
      font-size: 0.95rem;
      border: 1px solid #30363d;
      border-radius: 10px;
      background: #0d1117;
      color: #fff;
      outline: none;
    }

    #peer-id-input:focus {
      border-color: #58a6ff;
    }

    #connect-btn {
      padding: 11px 16px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #connect-btn:disabled {
      background: #21262d;
      color: #8b949e;
    }

    #passenger-status {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #8b949e;
    }

    #passenger-status.connected {
      color: #3fb950;
    }

    #passenger-status.error {
      color: #f85149;
    }

    /* 駕駛回覆顯示區 */
    #driver-reply-area {
      display: none;
      padding: 12px 14px;
      background: #1a2332;
      border-bottom: 1px solid #30363d;
      max-height: 28vh;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #driver-reply-area.show {
      display: block;
    }

    #driver-reply-label {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    #driver-reply-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #58a6ff;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }

    #input-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
      min-height: 0;
    }

    #message-input {
      flex: 1;
      width: 100%;
      padding: 14px;
      font-size: 1.15rem;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: #0d1117;
      color: #fff;
      resize: none;
      outline: none;
      line-height: 1.4;
      min-height: 80px;
    }

    #message-input:focus {
      border-color: #58a6ff;
    }

    #message-input:disabled {
      opacity: 0.5;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    #send-btn, #voice-btn, #clear-btn {
      flex: 1;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #send-btn {
      background: #1f6feb;
      color: #fff;
      flex: 2;
    }

    #send-btn:disabled {
      background: #21262d;
      color: #8b949e;
    }

    #voice-btn {
      background: #21262d;
      color: #fff;
    }

    #voice-btn.listening {
      background: #da3633;
      animation: pulse 1s infinite;
    }

    #clear-btn {
      background: #21262d;
      color: #8b949e;
      flex: 0.55;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* 快速常用語 */
    #quick-phrases {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 0 14px 14px;
    }

    .phrase-btn {
      padding: 9px 13px;
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .phrase-btn:active {
      background: #30363d;
    }

    /* 複製成功提示 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 選擇角色 -->
  <div id="role-select">
    <h1>開車大字訊息</h1>
    <p>給聽力不好的駕駛使用<br>雙向傳訊：乘客 ↔ 駕駛<br>駕駛端超大字顯示</p>
    <button class="role-btn driver" onclick="startAsDriver()">
      🚗 我是駕駛（接收端）
      <small>超大字顯示 + 也可回覆乘客</small>
    </button>
    <button class="role-btn passenger" onclick="startAsPassenger()">
      ✍️ 我是乘客（發送端）
      <small>輸入文字／語音，也可看駕駛回覆</small>
    </button>
  </div>

  <!-- 駕駛端 -->
  <div id="driver-view">
    <div id="driver-header">
      <div>
        <div id="driver-status">等待連線中...</div>
        <div style="margin-top:5px;">
          連線碼：<span id="peer-id-display">產生中...</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        <button id="font-minus-btn" onclick="changeFontSize(-0.4)" title="字體縮小">A−</button>
        <button id="font-plus-btn" onclick="changeFontSize(0.4)" title="字體放大">A+</button>
        <button id="clear-text-btn" onclick="clearBigText()" title="清除畫面">清除</button>
        <button id="share-btn" onclick="shareConnection()" title="分享連線碼給乘客">分享</button>
        <button id="copy-id-btn" onclick="copyPeerId()">複製</button>
        <button id="fullscreen-btn" onclick="toggleFullscreen()">全螢幕</button>
      </div>
    </div>
    <div id="message-area">
      <div id="big-text" class="empty">等待乘客發送訊息...</div>
    </div>
    <!-- 駕駛回覆列 -->
    <div id="driver-reply-bar">
      <input type="text" id="driver-reply-input" placeholder="回覆乘客..." autocomplete="off" />
      <button id="driver-send-btn" onclick="driverSend()">發送</button>
    </div>
    <div id="driver-footer">
      連線後可在下方回覆乘客｜點全螢幕更方便
    </div>
  </div>

  <!-- 乘客端 -->
  <div id="passenger-view">
    <div id="passenger-header">
      <h2>發送訊息給駕駛</h2>
      <div class="connect-row">
        <input type="text" id="peer-id-input" placeholder="輸入駕駛的連線碼" autocomplete="off" autocorrect="off" autocapitalize="off" />
        <button id="connect-btn" onclick="connectToDriver()">連線</button>
      </div>
      <div id="passenger-status">尚未連線</div>
    </div>

    <!-- 駕駛回覆顯示區 -->
    <div id="driver-reply-area">
      <div id="driver-reply-label">駕駛回覆：</div>
      <div id="driver-reply-text">—</div>
    </div>

    <div id="input-area">
      <textarea id="message-input" placeholder="在這裡輸入要告訴駕駛的話..." disabled></textarea>
      <div class="btn-row">
        <button id="voice-btn" onclick="toggleVoice()" disabled>🎤 語音</button>
        <button id="send-btn" onclick="sendMessage()" disabled>發送</button>
        <button id="clear-btn" onclick="clearInput()" disabled>清除</button>
      </div>
    </div>
    <div id="quick-phrases">
      <button class="phrase-btn" onclick="quickSend('右轉')">右轉</button>
      <button class="phrase-btn" onclick="quickSend('左轉')">左轉</button>
      <button class="phrase-btn" onclick="quickSend('直行')">直行</button>
      <button class="phrase-btn" onclick="quickSend('前方路口')">前方路口</button>
      <button class="phrase-btn" onclick="quickSend('注意行人')">注意行人</button>
      <button class="phrase-btn" onclick="quickSend('減速')">減速</button>
      <button class="phrase-btn" onclick="quickSend('停車')">停車</button>
      <button class="phrase-btn" onclick="quickSend('小心')">小心</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let peer = null;
    let conn = null;
    let isDriver = false;
    let recognition = null;
    let isListening = false;
    let currentFontSize = 3.5; // rem，預設大小

    // ========== 工具 ==========
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function setStatus(el, text, cls = '') {
      el.textContent = text;
      el.className = cls;
    }

    // ========== 駕駛端 ==========
    function startAsDriver() {
      isDriver = true;
      document.getElementById('role-select').style.display = 'none';
      document.getElementById('driver-view').style.display = 'flex';
      applySavedFontSize();

      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        document.getElementById('peer-id-display').textContent = id;
        setStatus(document.getElementById('driver-status'), '等待乘客連線...', '');
      });

      peer.on('connection', (connection) => {
        conn = connection;
        setupConnection(conn);
        setStatus(document.getElementById('driver-status'), '已連線 ✓', 'connected');
        document.getElementById('driver-reply-bar').classList.add('show');
        showToast('乘客已連線');
        requestWakeLock();
      });

      peer.on('error', (err) => {
        console.error(err);
        setStatus(document.getElementById('driver-status'), '連線錯誤，請重新整理', '');
      });

      peer.on('disconnected', () => {
        setStatus(document.getElementById('driver-status'), '已斷線，嘗試重連...', '');
        peer.reconnect();
      });
    }

    function setupConnection(connection) {
      connection.on('data', (data) => {
        if (typeof data === 'string') {
          if (isDriver) {
            // 駕駛收到乘客的訊息 → 超大字顯示
            showBigText(data);
          } else {
            // 乘客收到駕駛的回覆
            showDriverReply(data);
          }
        }
      });

      connection.on('close', () => {
        if (isDriver) {
          setStatus(document.getElementById('driver-status'), '乘客已斷線', '');
          showBigText('等待乘客重新連線...', true);
          document.getElementById('driver-reply-bar').classList.remove('show');
        } else {
          setStatus(document.getElementById('passenger-status'), '連線已斷開', 'error');
          disablePassengerInput();
        }
      });

      connection.on('error', (err) => {
        console.error('conn error', err);
      });
    }

    function showBigText(text, isEmpty = false) {
      const el = document.getElementById('big-text');
      el.textContent = text;
      el.className = isEmpty ? 'empty' : '';
      el.scrollTop = 0;
    }

    function clearBigText() {
      showBigText('等待乘客發送訊息...', true);
      showToast('已清除');
    }

    function changeFontSize(delta) {
      currentFontSize = Math.max(1.5, Math.min(8, currentFontSize + delta));
      const el = document.getElementById('big-text');
      if (el) el.style.setProperty('--big-font-size', currentFontSize + 'rem');
      try { localStorage.setItem('bigTextFontSize', currentFontSize); } catch(e) {}
      showToast('字體：' + currentFontSize.toFixed(1));
    }

    function applySavedFontSize() {
      try {
        const saved = parseFloat(localStorage.getItem('bigTextFontSize'));
        if (saved && saved >= 1.5 && saved <= 8) {
          currentFontSize = saved;
        }
      } catch(e) {}
      const el = document.getElementById('big-text');
      if (el) el.style.setProperty('--big-font-size', currentFontSize + 'rem');
    }

    function driverSend() {
      const input = document.getElementById('driver-reply-input');
      const text = input.value.trim();
      if (!text || !conn || !conn.open) return;

      conn.send(text);
      showToast('已回覆乘客');
      input.value = '';
      input.focus();
    }

    // 駕駛端按 Enter 發送
    document.addEventListener('DOMContentLoaded', () => {
      const driverInput = document.getElementById('driver-reply-input');
      if (driverInput) {
        driverInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            driverSend();
          }
        });
      }
    });

    function copyPeerId() {
      const id = document.getElementById('peer-id-display').textContent;
      if (id && id !== '產生中...') {
        navigator.clipboard.writeText(id).then(() => {
          showToast('已複製連線碼');
        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = id;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('已複製連線碼');
        });
      }
    }

    async function shareConnection() {
      const id = document.getElementById('peer-id-display').textContent;
      if (!id || id === '產生中...') {
        showToast('連線碼還沒產生');
        return;
      }

      const baseUrl = window.location.href.split('?')[0].split('#')[0];
      const inviteUrl = baseUrl + '?code=' + encodeURIComponent(id);
      const shareText = `開車大字訊息 - 請幫我傳訊息

請用手機瀏覽器打開這個連結：
${inviteUrl}

打開後選「我是乘客」，連線碼會自動填入，點連線就可以傳文字給我了！

（如果連線碼沒自動填，請手動輸入：${id}）`;

      // 優先使用系統分享（手機可直接選 LINE、訊息等）
      if (navigator.share) {
        try {
          await navigator.share({
            title: '開車大字訊息 - 連線碼',
            text: shareText
          });
          showToast('已開啟分享');
          return;
        } catch (err) {
          // 使用者取消分享不處理
          if (err.name === 'AbortError') return;
        }
      }

      // 不支援系統分享時，改為複製整段文字
      try {
        await navigator.clipboard.writeText(shareText);
        showToast('已複製完整邀請文字，可貼到 LINE');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = shareText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已複製完整邀請文字，可貼到 LINE');
      }
    }

    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // ========== 乘客端 ==========
    function startAsPassenger() {
      isDriver = false;
      document.getElementById('role-select').style.display = 'none';
      document.getElementById('passenger-view').style.display = 'flex';

      // 若網址帶有 ?code=xxx 則自動填入
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        if (code) {
          document.getElementById('peer-id-input').value = code;
        }
      } catch(e) {}

      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {});

      peer.on('error', (err) => {
        console.error(err);
        setStatus(document.getElementById('passenger-status'), '錯誤：' + err.type, 'error');
      });
    }

    function connectToDriver() {
      const id = document.getElementById('peer-id-input').value.trim();
      if (!id) {
        showToast('請輸入連線碼');
        return;
      }

      if (conn) {
        conn.close();
      }

      setStatus(document.getElementById('passenger-status'), '連線中...', '');
      document.getElementById('connect-btn').disabled = true;

      conn = peer.connect(id, { reliable: true });

      conn.on('open', () => {
        setStatus(document.getElementById('passenger-status'), '已連線 ✓ 可以發送訊息了', 'connected');
        enablePassengerInput();
        document.getElementById('driver-reply-area').classList.add('show');
        showToast('連線成功');
        document.getElementById('message-input').focus();
        setupConnection(conn);
      });

      conn.on('close', () => {
        setStatus(document.getElementById('passenger-status'), '連線已斷開', 'error');
        disablePassengerInput();
      });

      conn.on('error', (err) => {
        console.error(err);
        setStatus(document.getElementById('passenger-status'), '連線失敗，請確認連線碼', 'error');
        document.getElementById('connect-btn').disabled = false;
      });
    }

    function enablePassengerInput() {
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('voice-btn').disabled = false;
      document.getElementById('clear-btn').disabled = false;
      document.getElementById('connect-btn').disabled = false;
    }

    function disablePassengerInput() {
      document.getElementById('message-input').disabled = true;
      document.getElementById('send-btn').disabled = true;
      document.getElementById('voice-btn').disabled = true;
      document.getElementById('clear-btn').disabled = true;
    }

    function showDriverReply(text) {
      document.getElementById('driver-reply-text').textContent = text;
      // 簡單震動提示（如果支援）
      if (navigator.vibrate) {
        navigator.vibrate(200);
      }
      showToast('收到駕駛回覆');
    }

    function sendMessage() {
      const text = document.getElementById('message-input').value.trim();
      if (!text || !conn || !conn.open) return;

      conn.send(text);
      showToast('已發送');
    }

    function clearInput() {
      document.getElementById('message-input').value = '';
      document.getElementById('message-input').focus();
    }

    function quickSend(text) {
      if (!conn || !conn.open) {
        showToast('請先連線');
        return;
      }
      conn.send(text);
      showToast('已發送：' + text);
    }

    // ========== 語音輸入 ==========
    function toggleVoice() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        showToast('此瀏覽器不支援語音輸入');
        return;
      }

      if (isListening) {
        stopVoice();
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('voice-btn').classList.add('listening');
        document.getElementById('voice-btn').textContent = '🛑 停止';
        showToast('請開始說話...');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('message-input').value = transcript;
        if (conn && conn.open) {
          conn.send(transcript);
          showToast('語音已發送');
        }
      };

      recognition.onerror = (event) => {
        console.error(event.error);
        stopVoice();
        if (event.error !== 'aborted') {
          showToast('語音辨識失敗');
        }
      };

      recognition.onend = () => {
        stopVoice();
      };

      recognition.start();
    }

    function stopVoice() {
      isListening = false;
      document.getElementById('voice-btn').classList.remove('listening');
      document.getElementById('voice-btn').textContent = '🎤 語音';
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
    }

    // 乘客端按 Enter 發送
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('message-input');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
      }
    });

    // 防止螢幕休眠
    let wakeLock = null;
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isDriver) {
        requestWakeLock();
      }
    });

    // 若網址有 code 參數，自動進入乘客模式並填入連線碼
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
          // 稍微延遲，確保畫面已就緒
          setTimeout(() => startAsPassenger(), 100);
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
